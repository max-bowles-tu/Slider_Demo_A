<!DOCTYPE html>
<html lang="en">
    <head>
        <meta chartset="UTF-8">
        <title>SliderPitch</title>
    </head>
<body>
    <input id = "freq" type="range" min ="1" max = "20" value="1"><label id = "freqDisplay">PitchSlide</label>
<script>
const ctx = new AudioContext();
ctx.suspend();
let freq = 110

const osc1 = new OscillatorNode(ctx);
osc1.type = "triangle"

const osc2 = new OscillatorNode(ctx);
osc2.type = "triangle"

const osc3 = new OscillatorNode(ctx);
osc3.type = "triangle"


const gain = new GainNode(ctx);
gain.gain.value = 0.1


osc1.connect(gain);
osc2.connect(gain);
osc3.connect(gain);
gain.connect(ctx.destination);
osc1.start();
osc2.start();
osc3.start();

const slider = document.querySelector("#freq");
slider.addEventListener("input", () => {
    ctx.resume();
    osc1.frequency.value = freq * (Number(slider.value));
    osc2.frequency.value = (freq*2.1) * (Number(slider.value));
    osc3.frequency.value = (freq*5) * (Number(slider.value));
    document.querySelector("#freqDisplay").textContent = slider.value;

})
</script>

</body>

</html>
