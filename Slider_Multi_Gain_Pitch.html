<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <title>ARRRGH!</title>
    </head>
<body>

    <input id = "gain1" type="range" min="0" max="1" step="0.001" value="0.0"><label id="gainDisplay1">GainLevel_1</label>
    <input id = "freq" type="range" min ="1" max = "20" step="0.01" value="1"><label id = "freqDisplay">PitchSlide1</label>
    <input id = "gain2" type="range" min="0" max="1" step="0.001" value="0.0"><label id="gainDisplay2">GainLevel_2</label>
   
    <script>
        const ctx = new AudioContext();
        ctx.suspend();

        const osc1 = new OscillatorNode(ctx);
        let freq = 110
        
       
        const osc2 = new OscillatorNode(ctx);
        
        const osc3 = new OscillatorNode(ctx);
        
        
        
        
        const gain = new GainNode(ctx);
        gain.gain.value = 0.1;

        osc1.connect(gain);
        osc2.connect(gain);
        osc3.connect(gain);
        gain.connect(ctx.destination);
        osc1.start();
        osc2.start();
        osc3.start();

        const slider1 = document.querySelector("#gain1");
        slider1.addEventListener("input", () => {
            ctx.resume();
        gain.gain.value = Number(slider1.value);
        document.querySelector("gainDisplay1").textContent = slider1.value;

        });

        const slider2 = document.querySelector("#freq");
    slider2.addEventListener("input", () => {
    ctx.resume();
    osc1.frequency.value = freq * (Number(slider2.value));
    osc2.frequency.value = (freq*2.1) * (Number(slider2.value));
    osc3.frequency.value = (freq*0.5) * (Number(slider2.value));
    document.querySelector("#freqDisplay").textContent = slider2.value;
    });

     
    
    </script>

    </body>
    </html>
